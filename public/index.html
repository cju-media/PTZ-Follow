<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTZ Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 640px;
        }
        canvas {
            border: 1px solid black;
            cursor: crosshair;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
        }
        input[type="text"] {
            flex-grow: 1;
            margin-right: 10px;
            padding: 5px;
        }
        button {
            padding: 5px 10px;
        }
    </style>
    <script src="https://jsmpeg.com/jsmpeg.min.js"></script>
    <script src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <h1>PTZ Auto Tracker</h1>

        <div class="controls">
            <div class="form-group">
                <label for="cam-id">Camera ID:</label>
                <input type="text" id="cam-id" placeholder="cam1">
            </div>
            <div class="form-group">
                <label for="cam-ip">VISCA IP:</label>
                <input type="text" id="cam-ip" placeholder="192.168.1.100">
            </div>
            <div class="form-group">
                <label for="cam-rtmp">RTMP Link:</label>
                <input type="text" id="cam-rtmp" placeholder="rtmp://server/live/stream">
            </div>
            <button id="setup-btn">Setup Camera</button>
            <button id="tracking-btn">Enable Tracking</button>
        </div>

        <div style="position: relative;">
            <canvas id="video-canvas" width="640" height="480"></canvas>
            <canvas id="overlay-canvas" width="640" height="480" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
